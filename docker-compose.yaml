version: "3.9"

x-airflow-common:
    &airflow-common
    build: ./datalitycs-airflow
    environment:
      &airflow-common-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__WEBSERVER__BASE_URL: "http://${HOST_DEVICE_IP}:${AIRFLOW_WEB_PORT:-8080}"
      AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
      AIRFLOW__CORE__FERNET_KEY: ''
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: 'http://airflow-apiserver:8080/execution/'
      AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
      _PIP_ADDITIONAL_REQUIREMENTS: ${_PIP_ADDITIONAL_REQUIREMENTS:-}
      AIRFLOW_CONFIG: '/opt/airflow/config/airflow.cfg'
      MINIO_ROOT_USER: "${MINIO_ROOT_USER}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD}"
      MINIO_ENDPOINT: "${MINIO_ENDPOINT}"
      MINIO_BUCKET_TEST: "${MINIO_BUCKET_TEST}"
      MINIO_BUCKET_PREP: "${MINIO_BUCKET_PREP}"
      MINIO_BUCKET_PROD: "${MINIO_BUCKET_PROD}"
      DUCKDB_TEST: "/opt/airflow/database/${DUCKDB_TEST}"
      DUCKDB_PREP: "/opt/airflow/database/${DUCKDB_PREP}"
      DUCKDB_PROD: "/opt/airflow/database/${DUCKDB_PROD}"
    volumes:
      - ./datalitycs-airflow/dags:/opt/airflow/dags
      - ./datalitycs-airflow/logs:/opt/airflow/logs
      - ./datalitycs-airflow/config:/opt/airflow/config
      - ./datalitycs-airflow/plugins:/opt/airflow/plugins
      - ./datalitycs-database:/opt/airflow/database
    user: "${AIRFLOW_UID:-50000}:0"
    depends_on:
      &airflow-common-depends-on
      airflow-postgres:
        condition: service_healthy
      datalitycs-storage-init:
        condition: service_completed_successfully
      datalitycs-database-init:
        condition: service_completed_successfully

services:

  datalitycs-database-init:
    image: python:3.12-slim  # base ligera con Python
    container_name: datalitycs-database-init
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD}"
      MINIO_ENDPOINT: "${MINIO_ENDPOINT}"
      MINIO_BUCKET_TEST: "${MINIO_BUCKET_TEST}"
      MINIO_BUCKET_PREP: "${MINIO_BUCKET_PREP}"
      MINIO_BUCKET_PROD: "${MINIO_BUCKET_PROD}"
      DUCKDB_TEST: "${DUCKDB_TEST}"
      DUCKDB_PREP: "${DUCKDB_PREP}"
      DUCKDB_PROD: "${DUCKDB_PROD}"
    volumes:
      - ./datalitycs-database:/database  # tu carpeta local con scripts SQL / DuckDB
    command: sh -c "pip install duckdb && python ./database/scripts/start_db.py"
    restart: "no"
    depends_on:
      datalitycs-storage-init:
        condition: service_completed_successfully

  datalitycs-storage:
    image: quay.io/minio/minio:latest
    container_name: datalitycs-storage
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_WEB_UI_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-secret123}
    volumes:
      - ./datalitycs-storage/minio_storage:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  datalitycs-storage-init:
    image: quay.io/minio/mc:latest
    container_name: datalitycs-storage-init
    depends_on:
      datalitycs-storage:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-secret123}
    volumes:
      - ./datalitycs-storage:/storage
    entrypoint: ["/bin/sh", "./storage/init/minio_init.sh"]
    restart: no

  datalitycs-inputs:
    build: ./datalitycs-inputs
    container_name: streamlit
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD}"
      MINIO_ENDPOINT: "${MINIO_ENDPOINT}"
      MINIO_BUCKET_TEST: "${MINIO_BUCKET_TEST}"
      MINIO_BUCKET_PREP: "${MINIO_BUCKET_PREP}"
      MINIO_BUCKET_PROD: "${MINIO_BUCKET_PROD}"
    ports:
      - "${STREAMLIT_INPUTS_WEB_PORT:-8501}:8501"
    volumes:
      - ./datalitycs-inputs/app.py:/app.py
      - ./datalitycs-inputs/data:/data
      - ./datalitycs-inputs/pages:/pages
      - ./datalitycs-database:/database
    command: streamlit run app.py --server.port=8501 --server.address=0.0.0.0
    depends_on:
      datalitycs-storage:
        condition: service_healthy
      datalitycs-storage-init:
        condition: service_completed_successfully
      datalitycs-inputs-init:
        condition: service_completed_successfully
    restart: unless-stopped

  datalitycs-inputs-init:
    image: alpine:latest
    container_name: streamlit-init
    volumes:
      - ./datalitycs-inputs:/datalitycs-inputs
      - ./datalitycs-database:/database
    command: ["/bin/sh", "./datalitycs-inputs/init/init_csvs.sh"]
    restart: no

  airflow-postgres:
    image: postgres:16
    profiles:
      - airflow
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-airflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-airflow}
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always

  airflow-apiserver:
    <<: *airflow-common
    profiles:
      - airflow
    command: api-server
    ports:
      - "${AIRFLOW_WEB_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/version"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    profiles:
      - airflow
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    profiles:
      - airflow
    command: dag-processor
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-triggerer:
    <<: *airflow-common
    profiles:
      - airflow
    command: triggerer
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type TriggererJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-init:
    <<: *airflow-common
    profiles:
      - airflow
    entrypoint: /bin/bash
    # yamllint disable rule:line-length
    command:
      - -c
      - |
        if [[ -z "${AIRFLOW_UID}" ]]; then
          echo
          echo -e "\033[1;33mWARNING!!!: AIRFLOW_UID not set!\e[0m"
          echo "If you are on Linux, you SHOULD follow the instructions below to set "
          echo "AIRFLOW_UID environment variable, otherwise files will be owned by root."
          echo "For other operating systems you can get rid of the warning with manually created .env file:"
          echo "    See: https://airflow.apache.org/docs/apache-airflow/stable/howto/docker-compose/index.html#setting-the-right-airflow-user"
          echo
          export AIRFLOW_UID=$$(id -u)
        fi
        one_meg=1048576
        mem_available=$$(($$(getconf _PHYS_PAGES) * $$(getconf PAGE_SIZE) / one_meg))
        cpus_available=$$(grep -cE 'cpu[0-9]+' /proc/stat)
        disk_available=$$(df / | tail -1 | awk '{print $$4}')
        warning_resources="false"
        if (( mem_available < 4000 )) ; then
          echo
          echo -e "\033[1;33mWARNING!!!: Not enough memory available for Docker.\e[0m"
          echo "At least 4GB of memory required. You have $$(numfmt --to iec $$((mem_available * one_meg)))"
          echo
          warning_resources="true"
        fi
        if (( cpus_available < 2 )); then
          echo
          echo -e "\033[1;33mWARNING!!!: Not enough CPUS available for Docker.\e[0m"
          echo "At least 2 CPUs recommended. You have $${cpus_available}"
          echo
          warning_resources="true"
        fi
        if (( disk_available < one_meg * 10 )); then
          echo
          echo -e "\033[1;33mWARNING!!!: Not enough Disk space available for Docker.\e[0m"
          echo "At least 10 GBs recommended. You have $$(numfmt --to iec $$((disk_available * 1024 )))"
          echo
          warning_resources="true"
        fi
        if [[ $${warning_resources} == "true" ]]; then
          echo
          echo -e "\033[1;33mWARNING!!!: You have not enough resources to run Airflow (see above)!\e[0m"
          echo "Please follow the instructions to increase amount of resources available:"
          echo "   https://airflow.apache.org/docs/apache-airflow/stable/howto/docker-compose/index.html#before-you-begin"
          echo
        fi
        echo
        echo "Creating missing opt dirs if missing:"
        echo
        mkdir -v -p /opt/airflow/{logs,dags,plugins,config}
        echo
        echo "Airflow version:"
        /entrypoint airflow version
        echo
        echo "Files in shared volumes:"
        echo
        ls -la /opt/airflow/{logs,dags,plugins,config}
        echo
        echo "Running airflow config list to create default config file if missing."
        echo
        /entrypoint airflow config list >/dev/null
        echo
        echo "Files in shared volumes:"
        echo
        ls -la /opt/airflow/{logs,dags,plugins,config}
        echo
        echo "Change ownership of files in /opt/airflow to ${AIRFLOW_UID}:0"
        echo
        chown -R "${AIRFLOW_UID}:0" /opt/airflow/
        echo
        echo "Change ownership of files in shared volumes to ${AIRFLOW_UID}:0"
        echo
        chown -v -R "${AIRFLOW_UID}:0" /opt/airflow/{logs,dags,plugins,config}
        echo
        echo "Files in shared volumes:"
        echo
        ls -la /opt/airflow/{logs,dags,plugins,config}

    # yamllint enable rule:line-length
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: ${_AIRFLOW_WWW_USER_USERNAME:-airflow}
      _AIRFLOW_WWW_USER_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD:-airflow}
      _PIP_ADDITIONAL_REQUIREMENTS: ''
    user: "0:0"

  airflow-cli:
    <<: *airflow-common
    profiles:
      - debug
    environment:
      <<: *airflow-common-env
      CONNECTION_CHECK_MAX_COUNT: "0"
    # Workaround for entrypoint issue. See: https://github.com/apache/airflow/issues/16252
    command:
      - bash
      - -c
      - airflow
    depends_on:
      <<: *airflow-common-depends-on

volumes:
  postgres-db-volume: