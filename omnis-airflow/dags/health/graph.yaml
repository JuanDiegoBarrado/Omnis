# Health flow: gym series and running sessions. Its DAG (schedule, tags...) is health.py.
# Only which task precedes which: each node is defined in tasks/<node>.yaml.
nodes:
  # Raw: files dropped by the producers in the data bucket, landed as text
  raw.series_gimnasio:
  raw.sesiones_carrera:

  # Orig
  orig.series_gimnasio:
    after: [raw.series_gimnasio]
  orig.sesiones_carrera:
    after: [raw.sesiones_carrera]

  # Archive: the raw files go to his/ once orig has taken them in, so they are loaded only once
  archive.series_gimnasio:
    after: [orig.series_gimnasio]
  archive.sesiones_carrera:
    after: [orig.sesiones_carrera]

  # Clean
  clean.series_gimnasio:
    after: [orig.series_gimnasio]
  clean.impacto_muscular:
    after: [clean.series_gimnasio]
  clean.impacto_zona:
    after: [clean.impacto_muscular]
  clean.sesiones_carrera:
    after: [orig.sesiones_carrera]
  clean.calendario:
    after: [clean.series_gimnasio, clean.sesiones_carrera]

  # Publish
  publish.calendario:
    after: [clean.calendario]
  publish.grupos_musculares:
  publish.series_gimnasio:
    after: [clean.series_gimnasio]
  publish.impacto_muscular:
    after: [clean.impacto_muscular]
  publish.impacto_zona:
    after: [clean.impacto_zona]
  publish.carga_semanal_grupo:
    after: [clean.calendario, clean.impacto_muscular]
  publish.carga_semanal_zona:
    after: [clean.calendario, clean.impacto_zona]
  publish.sesiones_carrera:
    after: [clean.sesiones_carrera]
