[pytest]
markers =
    integration: tests that start Postgres in a container, which needs Docker (deselect with -m "not integration")
# Engine tests, shipped inside the omnis package, the warehouse's tests (the SQL of its init) and the
# storage's (its server)
testpaths =
    omnis-airflow/plugins/omnis/tests
    omnis-database/tests
    omnis-storage/tests
norecursedirs =
    .git
    .venv
    omnis-airflow/logs
filterwarnings =
    # Airflow warns on import that it doesn't support Windows; the engine tests don't run Airflow
    ignore:Airflow currently can be run on POSIX-compliant:RuntimeWarning
