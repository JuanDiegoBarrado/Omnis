[pytest]
markers =
    integration: tests that start Postgres or MinIO in a container, which needs Docker (deselect with -m "not integration")
# Engine tests, shipped inside the omnis package, and the warehouse's tests (the SQL of its init)
testpaths =
    omnis-airflow/plugins/omnis/tests
    omnis-database/tests
norecursedirs =
    .git
    .venv
    omnis-airflow/logs
filterwarnings =
    # Airflow warns on import that it doesn't support Windows; the engine tests don't run Airflow
    ignore:Airflow currently can be run on POSIX-compliant:RuntimeWarning
